[project]
name = "heart-failure-prediction"
version = "1.0.0"
description = "Predicción de mortalidad por insuficiencia cardíaca con ML y Deep Learning"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "dask[complete]>=2024.1.0",
    "tensorflow>=2.15.0",
    "keras>=3.0.0",
    "joblib>=1.3.0",
    "imbalanced-learn>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
